<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060" role="img" aria-labelledby="title desc"><title id="title">Microsoft Number Pad · Codex 단축키 배치</title><desc id="desc">실제 Windows 매핑과 Codex 사용자 지정 파일을 대조한 키 배치. 0 앱샷, 1 추론 낮춤, 2 추론 높임, 3 모델 선택, 7 새 작업, 8 빠른 채팅, 9 보조 채팅. 4부터 6은 사용자 지정 연결 없음.</desc><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="13" flood-color="#19322d" flood-opacity="0.12"/></filter></defs><style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif}.mono{font-family:Consolas,monospace}</style><rect width="1440" height="1060" fill="#f2f5f1"/><text x="64" y="57" font-size="14" font-weight="700" letter-spacing="3" fill="#427b69">PERSONAL WORKSPACE / KEY MAP</text><text x="64" y="110" font-size="38" font-weight="700" fill="#142a24">넘버패드로 쓰는 Codex</text><text x="64" y="143" font-size="17" fill="#5d6f65">Microsoft Number Pad · Windows 설정 기준 · 2026.09.17</text><rect x="64" y="174" width="704" height="780" rx="30" fill="#182b31" filter="url(#shadow)"/>
<g><rect x="88" y="203" width="144" height="58" rx="14" fill="#0f2026"/><rect x="88" y="198" width="144" height="58" rx="14" fill="#293d45" stroke="#41555b"/><text x="106" y="222" font-size="16" font-weight="700" fill="#d7e1e0">▦</text><text x="106" y="243" font-size="12" font-weight="600" fill="#d7e1e0">계산기 실행</text></g>
<text x="278" y="221" fill="#f0f6f3" font-size="17" font-weight="700">MICROSOFT NUMBER PAD</text><text x="278" y="247" fill="#96acaf" font-size="13">버튼 숫자는 실제 키 · 아래 글자는 연결된 기능</text>
<g><rect x="88" y="281" width="144" height="114" rx="14" fill="#0f2026"/><rect x="88" y="276" width="144" height="114" rx="14" fill="#293d45" stroke="#41555b"/><text x="106" y="311" font-size="27" font-weight="700" fill="#d7e1e0">⌫</text><text x="106" y="341" font-size="15" font-weight="600" fill="#d7e1e0">이전 글자 삭제</text><text x="106" y="367" font-size="12" fill="#d7e1e0" opacity="0.75">Backspace</text></g>
<g><rect x="252" y="281" width="144" height="114" rx="14" fill="#0f2026"/><rect x="252" y="276" width="144" height="114" rx="14" fill="#293d45" stroke="#41555b"/><text x="270" y="311" font-size="27" font-weight="700" fill="#d7e1e0">/</text><text x="270" y="341" font-size="15" font-weight="600" fill="#d7e1e0">Tab</text><text x="270" y="367" font-size="12" fill="#d7e1e0" opacity="0.75">다음 입력 위치</text></g>
<g><rect x="416" y="281" width="144" height="114" rx="14" fill="#0f2026"/><rect x="416" y="276" width="144" height="114" rx="14" fill="#293d45" stroke="#41555b"/><text x="434" y="311" font-size="27" font-weight="700" fill="#d7e1e0">*</text><text x="434" y="341" font-size="15" font-weight="600" fill="#d7e1e0">왼쪽 Shift</text><text x="434" y="367" font-size="12" fill="#d7e1e0" opacity="0.75">F22 → L Shift</text></g>
<g><rect x="580" y="281" width="144" height="114" rx="14" fill="#0f2026"/><rect x="580" y="276" width="144" height="114" rx="14" fill="#293d45" stroke="#41555b"/><text x="598" y="311" font-size="27" font-weight="700" fill="#d7e1e0">−</text><text x="598" y="341" font-size="15" font-weight="600" fill="#d7e1e0">오른쪽 Shift</text><text x="598" y="367" font-size="12" fill="#d7e1e0" opacity="0.75">F23 → R Shift</text></g>
<g><rect x="88" y="411" width="144" height="114" rx="14" fill="#0f2026"/><rect x="88" y="406" width="144" height="114" rx="14" fill="#164c4b" stroke="#32877a"/><text x="106" y="441" font-size="27" font-weight="700" fill="#b9ffdc">7</text><text x="106" y="471" font-size="15" font-weight="600" fill="#b9ffdc">새 작업</text><text x="106" y="497" font-size="12" fill="#b9ffdc" opacity="0.75">프로젝트 없음 · F19</text></g>
<g><rect x="252" y="411" width="144" height="114" rx="14" fill="#0f2026"/><rect x="252" y="406" width="144" height="114" rx="14" fill="#164c4b" stroke="#32877a"/><text x="270" y="441" font-size="27" font-weight="700" fill="#b9ffdc">8</text><text x="270" y="471" font-size="15" font-weight="600" fill="#b9ffdc">빠른 채팅</text><text x="270" y="497" font-size="12" fill="#b9ffdc" opacity="0.75">F20</text></g>
<g><rect x="416" y="411" width="144" height="114" rx="14" fill="#0f2026"/><rect x="416" y="406" width="144" height="114" rx="14" fill="#164c4b" stroke="#32877a"/><text x="434" y="441" font-size="27" font-weight="700" fill="#b9ffdc">9</text><text x="434" y="471" font-size="15" font-weight="600" fill="#b9ffdc">보조 채팅 열기</text><text x="434" y="497" font-size="12" fill="#b9ffdc" opacity="0.75">F21</text></g>
<g><rect x="580" y="411" width="144" height="244" rx="14" fill="#0f2026"/><rect x="580" y="406" width="144" height="244" rx="14" fill="#293d45" stroke="#41555b"/><text x="598" y="441" font-size="27" font-weight="700" fill="#d7e1e0">+</text><text x="598" y="471" font-size="15" font-weight="600" fill="#d7e1e0">기본 + 입력</text><text x="598" y="497" font-size="12" fill="#d7e1e0" opacity="0.75">별도 매핑 없음</text></g>
<g><rect x="88" y="541" width="144" height="114" rx="14" fill="#0f2026"/><rect x="88" y="536" width="144" height="114" rx="14" fill="#24353c" stroke="#35464d"/><text x="106" y="571" font-size="27" font-weight="700" fill="#819a9e">4</text><text x="106" y="601" font-size="15" font-weight="600" fill="#819a9e">사용자 지정 없음</text><text x="106" y="627" font-size="12" fill="#819a9e" opacity="0.75">F16</text></g>
<g><rect x="252" y="541" width="144" height="114" rx="14" fill="#0f2026"/><rect x="252" y="536" width="144" height="114" rx="14" fill="#24353c" stroke="#35464d"/><text x="270" y="571" font-size="27" font-weight="700" fill="#819a9e">5</text><text x="270" y="601" font-size="15" font-weight="600" fill="#819a9e">사용자 지정 없음</text><text x="270" y="627" font-size="12" fill="#819a9e" opacity="0.75">F17</text></g>
<g><rect x="416" y="541" width="144" height="114" rx="14" fill="#0f2026"/><rect x="416" y="536" width="144" height="114" rx="14" fill="#24353c" stroke="#35464d"/><text x="434" y="571" font-size="27" font-weight="700" fill="#819a9e">6</text><text x="434" y="601" font-size="15" font-weight="600" fill="#819a9e">사용자 지정 없음</text><text x="434" y="627" font-size="12" fill="#819a9e" opacity="0.75">F18</text></g>
<g><rect x="88" y="671" width="144" height="114" rx="14" fill="#0f2026"/><rect x="88" y="666" width="144" height="114" rx="14" fill="#164c4b" stroke="#32877a"/><text x="106" y="701" font-size="27" font-weight="700" fill="#b9ffdc">1</text><text x="106" y="731" font-size="15" font-weight="600" fill="#b9ffdc">추론 수준 낮추기</text><text x="106" y="757" font-size="12" fill="#b9ffdc" opacity="0.75">F13</text></g>
<g><rect x="252" y="671" width="144" height="114" rx="14" fill="#0f2026"/><rect x="252" y="666" width="144" height="114" rx="14" fill="#164c4b" stroke="#32877a"/><text x="270" y="701" font-size="27" font-weight="700" fill="#b9ffdc">2</text><text x="270" y="731" font-size="15" font-weight="600" fill="#b9ffdc">추론 수준 높이기</text><text x="270" y="757" font-size="12" fill="#b9ffdc" opacity="0.75">F14</text></g>
<g><rect x="416" y="671" width="144" height="114" rx="14" fill="#0f2026"/><rect x="416" y="666" width="144" height="114" rx="14" fill="#164c4b" stroke="#32877a"/><text x="434" y="701" font-size="27" font-weight="700" fill="#b9ffdc">3</text><text x="434" y="731" font-size="15" font-weight="600" fill="#b9ffdc">모델 선택</text><text x="434" y="757" font-size="12" fill="#b9ffdc" opacity="0.75">F15</text></g>
<g><rect x="580" y="671" width="144" height="244" rx="14" fill="#0f2026"/><rect x="580" y="666" width="144" height="244" rx="14" fill="#293d45" stroke="#41555b"/><text x="598" y="701" font-size="27" font-weight="700" fill="#d7e1e0">Enter</text><text x="598" y="731" font-size="15" font-weight="600" fill="#d7e1e0">기본 Enter 동작</text><text x="598" y="757" font-size="12" fill="#d7e1e0" opacity="0.75">앱 문맥에 따름</text></g>
<g><rect x="88" y="801" width="308" height="114" rx="14" fill="#0f2026"/><rect x="88" y="796" width="308" height="114" rx="14" fill="#bbf4d6" stroke="#e7fff1"/><text x="106" y="831" font-size="27" font-weight="700" fill="#153c32">0</text><text x="106" y="861" font-size="15" font-weight="600" fill="#153c32">앱샷 · 현재 창을 채팅에 첨부</text><text x="106" y="887" font-size="12" fill="#153c32" opacity="0.75">Ctrl + Alt + F24</text></g>
<g><rect x="416" y="801" width="144" height="114" rx="14" fill="#0f2026"/><rect x="416" y="796" width="144" height="114" rx="14" fill="#293d45" stroke="#41555b"/><text x="434" y="831" font-size="27" font-weight="700" fill="#d7e1e0">.</text><text x="434" y="861" font-size="15" font-weight="600" fill="#d7e1e0">양쪽 Shift 매크로</text><text x="434" y="887" font-size="12" fill="#d7e1e0" opacity="0.75">현재 앱샷 조합 아님</text></g>
<rect x="818" y="174" width="558" height="780" rx="26" fill="#fff" stroke="#dce5dd"/>
<text x="852" y="219" font-size="23" fill="#17382c" font-weight="700">키를 누르면 무엇이 바뀌나요?</text>
<text x="852" y="260" font-size="19" fill="#167456" font-weight="700">0  앱샷</text>
<text x="852" y="289" font-size="17" fill="#42564b" font-weight="400">현재 창의 화면과 사용 가능한 텍스트를</text>
<text x="852" y="315" font-size="17" fill="#42564b" font-weight="400">Codex 채팅에 첨부합니다.</text>
<text x="852" y="358" font-size="19" fill="#167456" font-weight="700">1 · 2 · 3  답변 설정</text>
<text x="852" y="387" font-size="17" fill="#42564b" font-weight="400">1과 2는 입력창의 추론 수준을 낮추거나 높이고,</text>
<text x="852" y="413" font-size="17" fill="#42564b" font-weight="400">3은 모델 선택 메뉴를 엽니다.</text>
<text x="852" y="456" font-size="19" fill="#167456" font-weight="700">7 · 8 · 9  작업과 채팅</text>
<text x="852" y="485" font-size="17" fill="#42564b" font-weight="400">7은 프로젝트 없는 새 작업을 만듭니다.</text>
<text x="852" y="511" font-size="17" fill="#42564b" font-weight="400">8은 빠른 채팅, 9는 보조 채팅을 엽니다.</text>
<path d="M852 540H1342" stroke="#dfe7e1"/>
<text x="852" y="576" font-size="19" fill="#17382c" font-weight="700">넘버패드 밖의 사용자 지정 키</text>
<text x="852" y="612" font-size="16" fill="#42564b" font-weight="400">Ctrl + Shift + Space   메인 채팅 포커스</text>
<text x="852" y="642" font-size="16" fill="#42564b" font-weight="400">Ctrl + Shift + A           보조 채팅 포커스</text>
<text x="852" y="672" font-size="16" fill="#42564b" font-weight="400">F6                                스킬 다시 불러오기</text>
<text x="852" y="702" font-size="16" fill="#42564b" font-weight="400">Ctrl + Alt + Space       창 호출</text>
<rect x="842" y="736" width="510" height="189" rx="16" fill="#f2f6f2"/>
<text x="852" y="771" font-size="17" fill="#17382c" font-weight="700">읽는 방법</text>
<text x="852" y="802" font-size="14" fill="#42564b" font-weight="400">민트색: 연결된 Codex 기능 · 회색: 기본/기타 키</text>
<text x="852" y="829" font-size="14" fill="#42564b" font-weight="400">4~6은 사용자 지정 파일에 연결된 명령이 없습니다.</text>
<text x="852" y="856" font-size="14" fill="#42564b" font-weight="400">기본 동작이나 다른 앱의 기능까지 없다는 뜻은 아닙니다.</text>
<text x="852" y="893" font-size="14" fill="#42564b" font-weight="400">*와 −의 Shift 기능은 Windows 키 변환을 포함합니다.</text>
<text x="64" y="1000" font-size="15" fill="#596e60">근거: Microsoft 기기별 매핑 + Windows 키 변환 + Codex keybindings.json · 0번 앱샷은 사용자 작동 확인</text><text x="64" y="1028" font-size="13" fill="#7a897f">일부 Codex 기능은 입력창 포커스·선택 모델·현재 화면에 따라 사용할 수 있습니다. Mac에서는 별도 설정이 필요합니다.</text></svg>